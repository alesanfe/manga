<form id="mangaDownloadForm" style="display: inline;">
    {% csrf_token %}
    <button type="button" onclick="downloadMangaOneChapter({{ chapter }})" class="btn btn-secondary btn-sm">
        <i class="fas fa-download"></i> Download
    </button>
</form>

<script>
    function downloadMangaOneChapter(chapter) {
        // Obtener los valores del formulario
        var mangaName = '{{ name }}';

        // Crear objeto de datos
        var requestData = {
            manga_name: mangaName,
            chapters: [parseInt(chapter)]
        };
        
        $.ajaxSetup({
            beforeSend: function (xhr, settings) {
                if (!(/^http:.*/.test(settings.url) || /^https:.*/.test(settings.url))) {
                    // Solo agrega el token CSRF a las solicitudes del mismo dominio
                    xhr.setRequestHeader("X-CSRFToken", $('[name="csrfmiddlewaretoken"]').val());
                }
                
            }
        });

        // Realizar solicitud AJAX
        $.ajax({
            url: '/download',  // URL de tu vista Django
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestData),
            xhrFields: {
                responseType: 'blob'
            },
            success: function (response) {
                var link = document.createElement('a');
                link.href = window.URL.createObjectURL(response);
                link.download = 'manga_download.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },
            error: function (error) {
                // Manejar errores
                alert('Hubo un error al descargar el manga.');
                console.log(error)
            },
            complete: function () {
                alert('Descarga completada.')
            }
        });
    }
</script>
