services:
  mysql:
    container_name: mysql_db
    restart: always
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-manga_db}
      MYSQL_USER: ${MYSQL_USER:-manga_db_usr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-manga_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_network
  
  manga-app:
    container_name: manga_app
    restart: always
    env_file: .env
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    networks:
      - db_network
      - web_network
    depends_on:
      - mysql
    volumes:
      # Mount project code (development-friendly). Keeps container code in sync with host.
      - ../../:/usr/src/app
      # Persist and share collected static files between app and nginx
      # Note: Django settings expect static under CORE_DIR (core/static and core/staticfiles)
      - static_volume:/usr/src/app/core/staticfiles
      - ../../static:/usr/src/app/core/static
      # Optional media folder for uploaded files (persisted)
      - media_volume:/usr/src/app/media
      # Mount local .env into container (read-only) so env vars can be adjusted locally
      # Also mount into core/ because settings expect .env in CORE_DIR
      - ./.env:/usr/src/app/.env:ro
      - ./.env:/usr/src/app/core/.env:ro
    environment:
      # Control whether the DB should be populated on first startup (set in .env)
      - POPULATE_DB=${POPULATE_DB:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5005/health/');\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  populate-db:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: manga_populate
    restart: 'no'
    env_file: .env
    networks:
      - db_network
      - web_network
    depends_on:
      - mysql
    volumes:
      - ../../:/usr/src/app
      - static_volume:/usr/src/app/core/staticfiles
      - media_volume:/usr/src/app/media
    entrypoint: ["/bin/bash", "-c", "if [ -f 'data/initial_data.json' ]; then python manage.py loaddata data/initial_data.json; else python -c 'from utils.db_populate import populate_mangas; populate_mangas()'; fi"]
  nginx:
    container_name: nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      # Serve static files produced by Django
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - web_network
    depends_on: 
      - manga-app

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
